# default-configurations
imports:
    - javascript
    - php

tools:
    external_code_coverage:
        timeout: 1200 # Timeout 20min in seconds.

    php_cs_fixer: true

build:
    environment:
        php:
            version: '8.5.12'
    nodes:
        analysis:
            tests:
                override:
                    - php-scrutinizer-run
