name: Publish 5.0.1 tag

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag:
    name: Create immutable 5.0.1 tag
    runs-on: ubuntu-latest

    steps:
      - name: Create tag when it does not exist
        uses: actions/github-script@v8
        with:
          script: |
            const tag = '5.0.1';
            const { owner, repo } = context.repo;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Tag ${tag} already exists; nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });
            core.info(`Created tag ${tag} at ${context.sha}.`);
