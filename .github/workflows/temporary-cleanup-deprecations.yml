name: Apply final PHP 8.5 deprecation cleanup

on:
  push:
    branches:
      - codex/fix-all-phpunit-test-errors

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/fix-all-phpunit-test-errors

      - name: Apply targeted compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('phpunit.xml.dist'): [
                  ('        <file>AzineEmailBundle.php</file>\n', ''),
              ],
              Path('Tests/Controller/AzineEmailTemplateControllerTest.php'): [
                  ("self::isType('array')", 'self::isArray()'),
              ],
              Path('Services/TemplateProviderInterface.php'): [
                  ('array $params = null', '?array $params = null'),
              ],
              Path('Services/AzineTemplateProvider.php'): [
                  ('array $params = null', '?array $params = null'),
              ],
              Path('Tests/Functional/EmailImagesInEmailAndWebViewTest.php'): [
                  ('array $params = null', '?array $params = null'),
              ],
              Path('Tests/Services/AzineTwigSwiftMailerTest.php'): [
                  ('array $params = null', '?array $params = null'),
              ],
          }

          for path, path_replacements in replacements.items():
              content = path.read_text()
              for old, new in path_replacements:
                  if old not in content:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  content = content.replace(old, new)
              path.write_text(content)
          PY

          rm .github/workflows/temporary-cleanup-deprecations.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clean up PHP 8.5 and PHPUnit 12 deprecations'
          git push origin HEAD:codex/fix-all-phpunit-test-errors
