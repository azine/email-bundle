name: Make passive PHPUnit test doubles explicit

on:
  push:
    branches:
      - codex/fix-all-phpunit-test-errors

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/fix-all-phpunit-test-errors

      - name: Mark test classes that intentionally use passive mocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('Tests/Command/RemoveOldWebViewEmailsCommandTest.php'),
              Path('Tests/Command/SendNewsLetterCommandTest.php'),
              Path('Tests/Command/SendNotificationsCommandTest.php'),
              Path('Tests/Controller/AzineEmailTemplateControllerTest.php'),
              Path('Tests/Functional/EmailImagesInEmailAndWebViewTest.php'),
              Path('Tests/Services/AzineEmailTwigExtensionTest.php'),
              Path('Tests/Services/AzineNotifierServiceTest.php'),
              Path('Tests/Services/AzineRecipientProviderTest.php'),
              Path('Tests/Services/AzineTemplateProviderTest.php'),
              Path('Tests/Services/AzineTwigSwiftMailerTest.php'),
              Path('Tests/Services/AzineWebViewServiceTest.php'),
              Path('Tests/Services/SpamCheckServiceTest.php'),
          ]

          import_line = 'use PHPUnit\\Framework\\Attributes\\AllowMockObjectsWithoutExpectations;\n'
          attribute = '#[AllowMockObjectsWithoutExpectations]\n'

          for path in paths:
              content = path.read_text()

              if import_line not in content:
                  marker = 'use PHPUnit\\Framework\\TestCase;\n'
                  if marker in content:
                      content = content.replace(marker, import_line + marker, 1)
                  else:
                      namespace_match = re.search(r'^namespace [^;]+;\n', content, flags=re.MULTILINE)
                      if namespace_match is None:
                          raise SystemExit(f'Unable to locate namespace/import insertion point in {path}')
                      end = namespace_match.end()
                      content = content[:end] + '\n' + import_line + content[end:]

              if attribute not in content:
                  content, count = re.subn(
                      r'^(?=(?:final\s+)?class\s+\w+\s+extends\s+)',
                      attribute,
                      content,
                      count=1,
                      flags=re.MULTILINE,
                  )
                  if count != 1:
                      raise SystemExit(f'Unable to locate test class in {path}')

              path.write_text(content)

          ci = Path('.github/workflows/ci.yml')
          content = ci.read_text()
          old = '          --display-phpunit-notices\n          --display-notices\n'
          new = '          --display-phpunit-notices\n          --fail-on-phpunit-notice\n          --display-notices\n'
          if old not in content:
              raise SystemExit('Unable to add the PHPUnit notice failure gate')
          ci.write_text(content.replace(old, new, 1))
          PY

          rm .github/workflows/temporary-acknowledge-passive-mocks.yml

      - name: Commit explicit PHPUnit 12 test-double policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make passive PHPUnit test doubles explicit'
          git push origin HEAD:codex/fix-all-phpunit-test-errors
