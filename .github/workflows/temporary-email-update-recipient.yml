name: Apply explicit email-update recipient support

on:
  push:
    branches:
      - fix/email-update-confirmation-recipient

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/email-update-confirmation-recipient

      - name: Patch mailer API and coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mailer = Path('Services/AzineTwigMailer.php')
          content = mailer.read_text()
          old = "    public function sendEmailUpdateConfirmationMessage(UserInterface $user, string $confirmationUrl): void\n    {\n"
          new = "    public function sendEmailUpdateConfirmationMessage(\n        UserInterface $user,\n        string $confirmationUrl,\n        ?string $toEmail = null,\n    ): void {\n"
          if old not in content:
              raise SystemExit('Email update method signature was not found')
          content = content.replace(old, new, 1)

          old_recipient = "            $from,\n            (string) $user->getEmail(),\n        );\n    }\n\n    /**\n     * @param array{address?: string, sender_name?: string} $from\n     */\n"
          new_recipient = "            $from,\n            $toEmail ?? (string) $user->getEmail(),\n        );\n    }\n\n    /**\n     * @param array{address?: string, sender_name?: string} $from\n     */\n"
          if old_recipient not in content:
              raise SystemExit('Email update recipient call was not found')
          mailer.write_text(content.replace(old_recipient, new_recipient, 1))

          test = Path('Tests/Services/AzineTwigSwiftMailerTest.php')
          content = test.read_text()
          marker = "    public function testImmediateFlagUsesImmediateMailer(): void\n"
          addition = (
              "    public function testEmailUpdateConfirmationCanTargetThePendingNewAddress(): void\n"
              "    {\n"
              "        $mailer = $this->createMock(MailerInterface::class);\n"
              "        $mailer\n"
              "            ->expects(self::once())\n"
              "            ->method('send')\n"
              "            ->with(self::callback(static function (Email $email): bool {\n"
              "                return 'new-address@example.com' === $email->getTo()[0]->getAddress();\n"
              "            }));\n\n"
              "        $user = $this->createMock(\\FOS\\UserBundle\\Model\\UserInterface::class);\n"
              "        $user->method('getEmail')->willReturn('old-address@example.com');\n\n"
              "        $this->createService($mailer)->sendEmailUpdateConfirmationMessage(\n"
              "            $user,\n"
              "            'https://example.test/confirm-email-update',\n"
              "            'new-address@example.com',\n"
              "        );\n"
              "    }\n\n"
          )
          if marker not in content:
              raise SystemExit('Test insertion marker was not found')
          test.write_text(content.replace(marker, addition + marker, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Services/AzineTwigMailer.php Tests/Services/AzineTwigSwiftMailerTest.php
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Recipient support is already present.'
            exit 0
          fi
          git commit -m 'Allow email update confirmations to target the new address'
          git push origin HEAD:fix/email-update-confirmation-recipient
